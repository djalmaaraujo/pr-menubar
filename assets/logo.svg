<svg width="640" height="220" viewBox="0 0 640 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PR Menubar logo">
  <defs>
    <linearGradient id="strokeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="20" y="30" width="160" height="160" rx="35" fill="url(#bgGrad)" stroke="url(#strokeGrad)" stroke-width="4"/>

  <!-- pull-request glyph: two branches merging into one node -->
  <g stroke="url(#strokeGrad)" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M74 74 V110 C74 133 82 143 97 148"/>
    <path d="M126 74 V110 C126 133 118 143 103 148"/>
  </g>
  <g fill="url(#strokeGrad)">
    <circle cx="74" cy="64" r="10"/>
    <circle cx="126" cy="64" r="10"/>
    <circle cx="100" cy="152" r="11"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#e2e8f0">PR Menubar</text>

  <!-- Tagline -->
  <text x="212" y="160" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#94a3b8">your open PRs, right in the menu bar</text>
</svg>
